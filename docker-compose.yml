services:
  aidashboard:
    build: .
    container_name: aidashboard
    ports:
      - "${PORT:-3102}:3102"
    environment:
      HOST: 0.0.0.0
      PORT: 3102
      HEALTH_CHECK_TIMEOUT_MS: ${HEALTH_CHECK_TIMEOUT_MS:-8000}
      HEALTH_POLL_INTERVAL_MS: ${HEALTH_POLL_INTERVAL_MS:-30000}
      VM_PROBE_TIMEOUT_MS: ${VM_PROBE_TIMEOUT_MS:-8000}
      VM_POLL_INTERVAL_MS: ${VM_POLL_INTERVAL_MS:-30000}
      LLM_PROBE_TIMEOUT_MS: ${LLM_PROBE_TIMEOUT_MS:-15000}
      LLM_POLL_INTERVAL_MS: ${LLM_POLL_INTERVAL_MS:-45000}
      DOCKER_POLL_INTERVAL_MS: ${DOCKER_POLL_INTERVAL_MS:-20000}
      # Удалённый Docker Engine API вместо локального сокета (см. раздел Docker в README):
      # DOCKER_HOST: tcp://192.168.1.50:2375
    volumes:
      - ./data:/app/data
      # Раскомментируйте, чтобы дашборд видел контейнеры на этом же хосте (только чтение):
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
